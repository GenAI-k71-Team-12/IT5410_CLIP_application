[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-image-retrieval"
version = "0.1.0"
description = "Shared contracts and explicit mock API for CLIP image retrieval"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.4", "uvicorn==0.34.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
